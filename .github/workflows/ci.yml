name: BrewLite CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run lint
        run: npm run lint --if-present
        working-directory: ./frontend

      - name: Run tests
        run: npm test --if-present
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test?schema=public
      PAYMENT_TEST_DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test?schema=payment_test
      JWT_SECRET: ci-only-secret-not-used-in-production
      REQUEST_LIMITS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: ./backend

      - name: Prepare isolated test schema
        run: npx prisma db push --skip-generate
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ env.PAYMENT_TEST_DATABASE_URL }}

      - name: Run lint
        run: npm run lint --if-present
        working-directory: ./backend

      - name: Run tests
        run: npm test --if-present
        working-directory: ./backend

      - name: Build backend
        run: npm run build
        working-directory: ./backend
