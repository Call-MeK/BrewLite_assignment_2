name: BrewLite CD

# Chỉ phát hành khi CI trên `main` đã xanh. `workflow_run` đảm bảo không deploy
# một commit chưa qua lint/test/build; `workflow_dispatch` dùng để phát hành lại
# thủ công khi cần (ví dụ redeploy sau khi đổi biến môi trường).
on:
  workflow_run:
    workflows:
      - BrewLite CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Không huỷ giữa chừng: một lần deploy đang chạy phải kết thúc trước khi lần sau bắt đầu.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://brewlite-api-u2jb.onrender.com/api/v1' }}
  WEB_URL: ${{ vars.WEB_URL || 'https://brewlite-acme-1b6f1.vercel.app' }}
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-dbre87c9v7es73cb98u0' }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_Rqb03eNemvWHYK1hD5s0VJzcELX3' }}
  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || 'team_YfilrPkmk57ChCpE6tVq6PUq' }}
  # Tuỳ chọn: nếu khai báo, CD áp migration trước khi deploy thay vì để container tự chạy.
  PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

jobs:
  release:
    name: Release production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    environment:
      name: production
      url: https://brewlite-acme-1b6f1.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve target commit
        id: target
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$DISPATCH_SHA}"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -z "$sha" ] || [ "$sha" != "$main_sha" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD skipped::${sha:0:7} is not the current head of main (${main_sha:0:7})."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        if: steps.target.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.target.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Apply Prisma migrations
        id: migrate
        if: steps.target.outputs.current == 'true' && env.PROD_DATABASE_URL != ''
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
          echo "::notice title=Migrations::Prisma migrations applied to the production database."

      - name: Deploy API to Render
        id: api_deploy
        if: steps.target.outputs.current == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ steps.target.outputs.sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error title=Missing secret::RENDER_API_KEY is not configured in this repository."
            exit 1
          fi

          api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          auth="Authorization: Bearer ${RENDER_API_KEY}"
          deploys="$(curl -sS -f -H "$auth" "${api}/deploys?limit=20")"

          # Ghi nhớ bản đang chạy để rollback nếu smoke test thất bại.
          prev="$(printf '%s' "$deploys" | jq -r '[.value[].deploy | select(.status == "live")][0].id // ""')"
          echo "previous=${prev}" >> "$GITHUB_OUTPUT"

          # Render có thể đã tự deploy commit này (Auto-Deploy). Khi đó chỉ cần theo dõi,
          # tránh tạo bản deploy trùng.
          existing="$(printf '%s' "$deploys" | jq -r --arg sha "$SHA" '
            [.value[].deploy
              | select(.commit.id == $sha)
              | select(.status == "live"
                       or .status == "created"
                       or .status == "queued"
                       or .status == "build_in_progress"
                       or .status == "update_in_progress"
                       or .status == "pre_deploy_in_progress")]
            | .[0].id // ""')"

          # Chạy tay = deploy lại thật sự (ví dụ sau khi đổi biến môi trường trên Render).
          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            existing=""
          fi

          if [ -n "$existing" ]; then
            deploy_id="$existing"
            echo "::notice title=Render::Verifying existing deploy ${deploy_id} for ${SHA:0:7}."
          else
            deploy_id="$(curl -sS -f -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"commitId\":\"${SHA}\",\"clearCache\":\"do_not_clear\"}" \
              "${api}/deploys" | jq -r '.id')"
            echo "::notice title=Render::Triggered deploy ${deploy_id} for ${SHA:0:7}."
          fi
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy
        id: api_wait
        if: steps.target.outputs.current == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.api_deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          auth="Authorization: Bearer ${RENDER_API_KEY}"
          for attempt in $(seq 1 60); do
            status="$(curl -sS -f -H "$auth" "${api}/deploys/${DEPLOY_ID}" | jq -r '.status // "unknown"')"
            echo "attempt ${attempt}: ${status}"
            case "$status" in
              live)
                echo "::notice title=Render::Deploy ${DEPLOY_ID} is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error title=Render::Deploy ${DEPLOY_ID} ended as ${status}."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error title=Render::Timed out waiting for deploy ${DEPLOY_ID}."
          exit 1

      - name: Smoke test API
        id: api_smoke
        if: steps.target.outputs.current == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS --max-time 90 "${API_BASE_URL}/health" || true)"
            status="$(printf '%s' "$response" | jq -r '.data.status // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ]; then
              printf '%s\n' "$response"
              echo "::notice title=Smoke test::API health is ok."
              exit 0
            fi
            echo "attempt ${attempt}: ${response:-<no response>}"
            sleep 10
          done
          echo "::error title=Smoke test::API health did not return data.status=ok."
          exit 1

      - name: Deploy and verify frontend
        id: web
        if: steps.target.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            if [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
              curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null
              echo "::notice title=Vercel::Triggered the production deploy hook."
            else
              echo "::notice title=Vercel::VERCEL_TOKEN and VERCEL_DEPLOY_HOOK are not set; only the URL smoke test runs."
            fi
            echo "::notice title=Vercel::Skipping deployment polling because VERCEL_TOKEN is not configured."
            exit 0
          fi

          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          base="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}"

          # Ghi nhớ bản production đang chạy trước khi trigger bản mới, để rollback đúng.
          prev="$(curl -sS -f -H "$auth" "${base}&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].id // ""')"
          echo "previous=${prev}" >> "$GITHUB_OUTPUT"

          if [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null
            echo "::notice title=Vercel::Triggered the production deploy hook."
          else
            echo "::notice title=Vercel::No deploy hook configured; using the Git integration deployment."
          fi

          for attempt in $(seq 1 60); do
            body="$(curl -sS -f -H "$auth" "${base}&sha=${SHA}&limit=1")"
            id="$(printf '%s' "$body" | jq -r '.deployments[0].id // ""')"
            state="$(printf '%s' "$body" | jq -r '.deployments[0].readyState // ""')"
            echo "attempt ${attempt}: ${id:-<none>} ${state:-<unknown>}"
            if [ "$state" = "READY" ]; then
              echo "deployment_id=${id}" >> "$GITHUB_OUTPUT"
              echo "url=https://$(printf '%s' "$body" | jq -r '.deployments[0].url // ""')" >> "$GITHUB_OUTPUT"
              echo "::notice title=Vercel::Deployment ${id} is ready."
              exit 0
            fi
            case "$state" in
              ERROR|CANCELED|BLOCKED)
                echo "::error title=Vercel::Deployment ${id} ended as ${state}."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error title=Vercel::Timed out waiting for a deployment of ${SHA:0:7}."
          exit 1

      - name: Smoke test frontend
        id: web_smoke
        if: steps.target.outputs.current == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl -sS -L -o web-home.html -w '%{http_code}' --max-time 60 "$WEB_URL" || true)"
            if [ "$code" = "200" ] && grep -qi "brewlite" web-home.html; then
              echo "::notice title=Smoke test::Frontend responded with HTTP 200."
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-000}"
            sleep 10
          done
          echo "::error title=Smoke test::Frontend did not return HTTP 200 with the BrewLite shell."
          exit 1

      - name: Roll back API
        if: >-
          failure() &&
          steps.api_smoke.outcome == 'failure' &&
          steps.api_deploy.outputs.previous != '' &&
          steps.api_deploy.outputs.deploy_id != steps.api_deploy.outputs.previous
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PREVIOUS_DEPLOY_ID: ${{ steps.api_deploy.outputs.previous }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          echo "::warning title=Rollback::Rolling Render back to ${PREVIOUS_DEPLOY_ID}."
          curl -sS -f -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\":\"${PREVIOUS_DEPLOY_ID}\"}" \
            "${api}/rollback"

      - name: Roll back frontend
        if: >-
          failure() &&
          steps.web_smoke.outcome == 'failure' &&
          steps.web.outputs.previous != '' &&
          steps.web.outputs.deployment_id != steps.web.outputs.previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.web.outputs.previous }}
        run: |
          set -euo pipefail
          echo "::warning title=Rollback::Pointing Vercel production back to ${PREVIOUS_DEPLOYMENT_ID}."
          curl -sS -f -X POST -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/rollback/${PREVIOUS_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}"

      - name: Summary
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_CURRENT: ${{ steps.target.outputs.current }}
          MIGRATE: ${{ steps.migrate.outcome }}
          API_DEPLOY: ${{ steps.api_deploy.outcome }}
          API_WAIT: ${{ steps.api_wait.outcome }}
          API_SMOKE: ${{ steps.api_smoke.outcome }}
          WEB: ${{ steps.web.outcome }}
          WEB_SMOKE: ${{ steps.web_smoke.outcome }}
        run: |
          {
            echo "## BrewLite CD"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Target commit | \`${TARGET_SHA:0:7}\` (still main HEAD: ${TARGET_CURRENT:-unknown}) |"
            echo "| Prisma migrations | ${MIGRATE:-skipped} |"
            echo "| Deploy API (Render) | ${API_DEPLOY:-skipped} |"
            echo "| Wait for Render deploy | ${API_WAIT:-skipped} |"
            echo "| Smoke test API | ${API_SMOKE:-skipped} |"
            echo "| Deploy/verify frontend | ${WEB:-skipped} |"
            echo "| Smoke test frontend | ${WEB_SMOKE:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
